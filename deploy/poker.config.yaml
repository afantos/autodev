# autodev configuration for the DigitalOcean droplet (autodev-1), projects: poker (Linear team DEV), luckywinclub (Linear team LWC) and email-support (Linear team EML).
# Installed to /opt/autodev/instance/autodev.config.yaml. Contains NO secrets: credentials come only from
# /opt/autodev/instance/.env. All choices below were made by the operator on 2026-10-24.

dataDir: ./data                          # /opt/autodev/instance/data (state DB, records; agents denied)
workspaceDir: /opt/autodev/instance-work # clones, worktrees, candidate snapshots (outside HOME/config/data)

tracker: linear
scm: github
runner: claude

projects:
  - key: poker
    repo: afantos/poker
    linear:
      teamKey: DEV
    setup: ["npm ci --offline --no-audit"]          # command networking is disabled inside the sandbox
    npmCacheDir: /opt/autodev/instance/cache/npm     # operator-seeded from poker's package-lock.json
    validate: ["npm run typecheck", "npm run lint", "npm test", "NODE_ENV=production npm run build"]   # build in production mode; tests use NODE_ENV=test
    requiredChecks: ["checks"]                       # GitHub Actions job in .github/workflows/ci.yml
    env:
      NODE_ENV: test
    maxConcurrent: 1
    stackedBranches: false
    # Approved 2026-10-24 (poker ADRs 0002, 0007). Lockfile changes still always go to human review.
    approvedDependencies: [ws, react, react-dom, vite, "@types/ws", "@types/react", "@types/react-dom"]
    # Import boundaries (poker ADR 0006) and CI are human-only; .github/ and manifests are covered by the base policy
    # (package.json scripts/fields and unapproved dependencies, and every lockfile change, still go to a human).
    # 2026-10-26 (owner): package.json/package-lock.json dropped from humanReviewPaths, same as luckywinclub.
    humanReviewPaths: ['^eslint-rules/', '^eslint\.config\.js$', '^test/boundaries\.test\.ts$', '^test/workspaces\.test\.ts$', '(^|/)tsconfig(\.base)?\.json$', '(^|/)vite\.config\.ts$', '^CLAUDE\.md$', '^GLOSSARY\.md$', '^docs/mvp-spec\.md$', '^docs/adr/']
    protectTests: true                               # any change to an existing test file goes to a human; new test files are scanned
    # 2026-10-26 (owner): the second reviewer approves policy-flagged diffs instead of the owner; CI, the Claude review
    # and the second review still apply. GitHub workflows, deploy files and credentials always go to the owner.
    flaggedDiffApprover: second-review
    alwaysHumanPaths: ['(^|/)\.github/', '(^|/)(deploy|infrastructure|terraform)(/|$)', '(^|/)\.env', '(^|/)(secrets?|credentials?)(/|[._-]|$)']
    # Clean PRs merge without a human: CI, Claude review, second review (secondReview below), policy clean, up to date.
    # Anything the policy flags still waits for a human. Needs GITHUB_REVIEWER_TOKEN and OPENAI_API_KEY in .env.
    autoMerge: true
    # docs/online-play-tickets.md gives reviewers each ticket's scope (e.g. MP-16 owns real-clock timers, not MP-10).
    docs: [CLAUDE.md, README.md, GLOSSARY.md, docs/mvp-spec.md, docs/adr, docs/online-play-tickets.md]

  # luckywinclub (Linear team LWC, repo afantos/luckywinclub), onboarded 2026-10-25. The repository starts
  # with documents only; the scaffold (package.json, tsconfig, ESLint, node:test) is the first ticket.
  # Scaffold merged 2026-10-26 (LWC-9, main 312d81a): setup/validate are live; the npm cache is operator-seeded from the lockfile.
  # 2026-10-26 (owner): autoMerge on, milestone 1 dependencies approved (ADR 0001, 85c2f78), package.json/package-lock.json
  # dropped from humanReviewPaths. The base policy still sends manifest script/field changes, unapproved dependencies
  # and every lockfile change to a human.
  - key: luckywinclub
    repo: afantos/luckywinclub
    linear:
      teamKey: LWC
    setup: ["npm ci --offline --no-audit"]          # command networking is disabled inside the sandbox
    npmCacheDir: /opt/autodev/instance/cache/luckywinclub/npm   # operator-seeded from luckywinclub's package-lock.json (2026-10-26, main 312d81a)
    npmCachePrime: true                              # 2026-10-26 (owner): prime the cache automatically for approved/transitive registry packages (src/npm-cache-prime.ts)
    validate: ["npm run typecheck", "npm run lint", "npm test", "npm run build"]   # offline, unit-level only (ADR 0001); Compose/Playwright run in GitHub CI
    requiredChecks: ["checks", "integration"]        # both required by branch protection (integration = Postgres via Compose, since PR #12)
    env:
      NODE_ENV: test
    maxConcurrent: 1
    stackedBranches: false
    approvedDependencies: [drizzle-orm, drizzle-kit, pg, "@types/pg", pg-boss, next, react, react-dom, "@types/react", "@types/react-dom", tailwindcss, "@tailwindcss/postcss", better-auth, "@playwright/test"]
    humanReviewPaths: ['(^|/)tsconfig(\.base)?\.json$', '^eslint\.config\.js$', '^CLAUDE\.md$', '^docs/product-spec\.md$', '^docs/adr/', '^docker-compose', '^\.github/']
    protectTests: true
    # 2026-10-26 (owner): the second reviewer approves policy-flagged diffs instead of the owner; CI, the Claude review
    # and the second review still apply. GitHub workflows, deploy files and credentials always go to the owner.
    flaggedDiffApprover: second-review
    alwaysHumanPaths: ['(^|/)\.github/', '(^|/)(deploy|infrastructure|terraform)(/|$)', '(^|/)\.env', '(^|/)(secrets?|credentials?)(/|[._-]|$)']
    autoMerge: true                                  # clean PRs merge after CI + Claude review + second review; flagged PRs wait for a human
    docs: [CLAUDE.md, README.md, docs/product-spec.md, docs/adr]

  # email-support (Linear team EML, repo afantos/email-support), onboarded 2026-10-27. Decisions: email-support
  # docs/adr/0001-initial-decisions.md. The repository starts with documents only (main 4c9547b); the scaffold is the
  # first ticket (EML-2). autoMerge stays off until the scaffold merges; then turn it on with flaggedDiffApprover:
  # second-review (owner decision, ADR 0001 §20).
  # 2026-10-27 (owner, Q34): setup/validate and automatic cache priming are live BEFORE the scaffold ticket, so EML-2's
  # first validation primes the empty cache from its own lockfile. A probe lockfile of the 19 approved dependencies was
  # 378 packages / 805 MB (Next.js ships one ~35 MB compiler per platform), above the 400 / 500 MB defaults.
  - key: email-support
    repo: afantos/email-support
    linear:
      teamKey: EML
    # 2026-10-27 (owner, Q35): setup also runs on the fresh checkout before the agent writes code, and the repository has no
    # lockfile until the scaffold, so it is skipped then. Back to plain `npm ci --offline --no-audit` after EML-2 merges.
    setup: ["test ! -f package-lock.json || npm ci --offline --no-audit"]   # command networking is disabled inside the sandbox
    npmCacheDir: /opt/autodev/instance/cache/email-support/npm   # starts with an empty _cacache (the sandbox copies it); filled by npmCachePrime
    npmCachePrime: true
    npmCachePrimeMaxArtifacts: 600
    npmCachePrimeMaxMb: 1500
    npmCachePrimeTimeoutMinutes: 15
    validate: ["npm run typecheck", "npm run lint", "npm test", "npm run build"]   # offline, unit-level; Postgres/RLS tests run in the GitHub integration job
    requiredChecks: ["checks", "integration"]        # both required by branch protection (integration = Postgres via Compose, incl. RLS)
    env:
      NODE_ENV: test
    maxConcurrent: 1
    stackedBranches: false
    approvedDependencies: [next, react, react-dom, "@types/react", "@types/react-dom", fastify, drizzle-orm, drizzle-kit, pg, "@types/pg", pg-boss, better-auth, zod, tailwindcss, "@tailwindcss/postcss", typescript, "@types/node", eslint, typescript-eslint]
    # Migrations are human-reviewed because one can drop a Row-Level Security policy (ADR 0001 §11, §19).
    humanReviewPaths: ['(^|/)tsconfig(\.base)?\.json$', '^eslint\.config\.js$', '^CLAUDE\.md$', '^docs/product-spec\.md$', '^docs/adr/', '^docker-compose', '^\.github/', '^packages/db/migrations/']
    protectTests: true
    alwaysHumanPaths: ['(^|/)\.github/', '(^|/)(deploy|infrastructure|terraform)(/|$)', '(^|/)\.env', '(^|/)(secrets?|credentials?)(/|[._-]|$)']
    autoMerge: false
    docs: [CLAUDE.md, README.md, docs/product-spec.md, docs/adr, docs/supervised-checklist.md]

linear:
  states:                                # must match your Linear workflow state names
    ideas: Ideas
    backlog: Backlog
    ready: Ready
    in_progress: In Progress
    review: In Review
    done: Done
    blocked: Blocked
    failed: Failed
    canceled: Canceled
  requireLabel: autodev                  # only tickets carrying this label are touched (safe default)

loop:
  tickSeconds: 60                       # 2026-10-26: halves per-tick Linear calls (shared key hit 2,500 requests/hour)

concurrency:
  global: 2                              # 2026-10-26 (owner): poker and luckywinclub run side by side; each project keeps maxConcurrent 1

budget:                                  # USD, SDK estimates; the Claude Console monthly limit is the hard stop
  dailyUsd: 200                          # 2026-10-26: owner decision
  monthlyUsd: 500
  perTicketUsd: 15                       # 2026-10-26: owner decision; replaces the one-time per-ticket overrides (all were below $15)
  perTicketOverrides: {}                 # owner-approved exceptions to perTicketUsd, by ticket
  perRunUsd: 1.5
  perDecisionUsd: 0.5
  onExhausted: manual                    # stay paused until `autodev resume` rather than resuming automatically

secondReview:                            # independent merge reviewer; separate budget from Claude (approved 2026-10-24)
  enabled: true
  provider: openai
  model: gpt-6.1-sol                     # $2 in / $0.10 cached / $10 out per 1M; >272K input: whole request 2x in, 1.5x out (checked 2026-10-24)
  dailyUsd: 50
  monthlyUsd: 300                        # also set this as the OpenAI project's monthly limit
  mergeOwnerApprovedDiffs: true          # 2026-10-26 (owner): a diff the owner approved by hash merges after the GPT review; no human merge step

models:
  planning: opus
  coding: sonnet
  codingComplex: opus
  complexThreshold: 4
  decision: sonnet
  review: opus
  classify: haiku

sandbox:
  enabled: true
  failIfUnavailable: true
  allowedDomains: [registry.npmjs.org]

dashboard: { enabled: false, host: 127.0.0.1, port: 7777 }   # not exposed; enable later with a token
report: { hour: -1 }                     # no notifications yet
