name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install OS isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # Grant this capability only to bwrap, rather than disabling the policy.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = 1 ]; then
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
      - run: npm ci
      - run: npm run check
        env:
          AUTODEV_REQUIRE_SANDBOX_TEST: '1'

  deploy:
    name: Deploy autodev
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: autodev-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install dedicated deploy identity
        env:
          DEPLOY_KEY: ${{ secrets.AUTODEV_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.AUTODEV_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/autodev-ci
          chmod 0600 ~/.ssh/autodev-ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy tested main commit (host rolls back failed startup)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.AUTODEV_DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_HOST"
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded main commit $GITHUB_SHA"
            exit 0
          fi
          git archive "$GITHUB_SHA" | ssh -i ~/.ssh/autodev-ci -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "root@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_NUMBER"
      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/autodev-ci
