name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install OS isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # Grant this capability only to bwrap, rather than disabling the policy.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = 1 ]; then
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
      - run: npm ci
      - run: npm run check
        env:
          AUTODEV_REQUIRE_SANDBOX_TEST: '1'
